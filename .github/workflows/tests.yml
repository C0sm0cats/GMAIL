name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # From the launcher's minimum (run-savegmail.sh) to the latest release.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the launcher's dependencies
        # The same list as run-savegmail.sh, unpinned like the launcher installs them.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade --upgrade-strategy eager \
            playwright \
            prompt_toolkit \
            rich \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            tzlocal \
            certifi
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Run the tests
        run: .venv/bin/python -m unittest discover -s tests
